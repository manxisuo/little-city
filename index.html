<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little City · 小小城市</title><style>
:root{font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;color:#24364a}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#cce5ef}canvas{display:block;width:100vw;height:100vh;touch-action:none}.panel{position:fixed;top:22px;left:22px;background:#fffdf5e8;backdrop-filter:blur(18px);padding:20px 22px;border:1px solid #ffffffa8;border-radius:22px;box-shadow:0 12px 40px #344e6630;max-width:310px}h1{font-size:24px;margin:0 0 4px;letter-spacing:-1px}.sub{font-size:12px;color:#748397;margin:0 0 14px}.tools{display:flex;flex-wrap:wrap;gap:7px}button{border:0;border-radius:12px;padding:9px 12px;background:#eaf0ee;color:#34495b;font-weight:650;cursor:pointer}button.active{background:#315c73;color:white}button:hover{filter:brightness(.96)}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.controls button{background:#fff;border:1px solid #dce5e4;font-size:12px}.hint{font-size:12px;line-height:1.6;color:#65788a;margin:12px 0 0}.stats{position:fixed;right:22px;top:22px;padding:12px 16px;border-radius:15px;background:#fffdf5dd;backdrop-filter:blur(10px);font-size:13px}.footer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border-radius:20px;background:#fffdf5e8;padding:10px 16px;font-size:12px;color:#6c7c88;white-space:nowrap}@media(max-width:600px){.panel{top:10px;left:10px;padding:12px;max-width:235px}.stats{right:10px;top:auto;bottom:65px}.footer{bottom:10px;font-size:10px}h1{font-size:19px}}
</style></head><body><canvas id="scene"></canvas><section class="panel"><h1>Little City <span style="font-size:17px">✦</span></h1><p class="sub">一座会呼吸的微型城市</p><div class="tools"><button data-tool="view" class="active">探索</button><button data-tool="house">建造房屋</button><button data-tool="tower">建造高楼</button><button data-tool="tree">种树</button><button data-tool="park">公园</button><button data-tool="road">道路</button><button data-tool="erase">拆除</button><button id="reset">重置</button></div><p class="hint">拖动平移 · 滚轮缩放 · 点击地块编辑<br>支持暂停、天气切换、截图与分享城市。</p><div class="controls"><button id="pause">⏸ 暂停</button><button id="weather">☀ 晴天</button><button id="speed">1× 速度</button><button id="capture">📷 截图</button><button id="share">↗ 分享</button></div><p class="hint" id="notice" aria-live="polite"></p></section><aside class="stats" id="stats"></aside><div class="footer">A tiny living world · Made with Canvas · 自动保存在本机</div><script>
const c=document.querySelector('#scene'),ctx=c.getContext('2d'),N=17,S=46,KEY='little-city-v1';let W,H,dpr=1,zoom=1,panX=0,panY=65,tool='view',drag=null,hover=null,selected=null,paused=false,weather='sun',speed=1,clock=0,lastFrame=0,carClock=0;let world;const rnd=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};const initial=()=>Array.from({length:N*N},(_,i)=>{let x=i%N,y=Math.floor(i/N),r=rnd(x,y);if(x%4===0||y%4===0)return 'road';return r<.14?'tree':r<.22?'park':r<.65?'house':'tower'});try{world=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(world)||world.length!==N*N)world=initial()}catch{world=initial()}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(world))}catch{}};const notify=(msg)=>{document.querySelector('#notice').textContent=msg;setTimeout(()=>{if(document.querySelector('#notice').textContent===msg)document.querySelector('#notice').textContent=''},3500)};try{const data=new URLSearchParams(location.hash.slice(1)).get('city');if(data){let decoded=JSON.parse(atob(data));if(Array.isArray(decoded)&&decoded.length===N*N&&decoded.every(v=>['road','house','tower','tree','park','empty'].includes(v)))world=decoded}}catch{}const colors=['#e5a6a0','#e7c18e','#98bcb9','#b2a6cf','#9bb7d5','#d8b3a4'];const clamp=(a,b,d)=>Math.max(b,Math.min(d,a));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function project(x,y,z=0){return {x:W/2+panX+(x-y)*S*zoom,y:H/2+panY+(x+y)*S*.48*zoom-z*zoom}}function polygon(pts,color){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fillStyle=color;ctx.fill()}function tile(x,y,color){polygon([project(x,y),project(x+1,y),project(x+1,y+1),project(x,y+1)],color)}function block(x,y,w,d,h,front,right,roof){let a=project(x,y,h),b=project(x+w,y,h),cc=project(x+w,y+d,h),e=project(x,y+d,h),ab=project(x,y),bb=project(x+w,y),cb=project(x+w,y+d),eb=project(x,y+d);polygon([e,cc,cb,eb],front);polygon([b,cc,cb,bb],right);polygon([a,b,cc,e],roof);return {a,b,cc,e}}function line(a,b,color,width){ctx.strokeStyle=color;ctx.lineWidth=width*zoom;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function circle(p,r,color){ctx.beginPath();ctx.arc(p.x,p.y,r*zoom,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function tree(x,y,t){let sway=Math.sin(t*.0009+x*2+y)*.05;let p=project(x+.5,y+.5,0),top=project(x+.5+sway,y+.5,20);line(p,top,'#806b5b',4);circle(project(x+.5+sway,y+.5,26),13,'#4b947b');circle(project(x+.37+sway,y+.45,29),9,'#6eaf86');circle(project(x+.65+sway,y+.5,25),8,'#78b894')}function building(x,y,type,t,night){let r=rnd(x+5,y+2),h=type==='tower'?55+Math.floor(r*4)*12:24+Math.floor(r*3)*5,col=colors[Math.floor(r*colors.length)];let b=block(x+.13,y+.13,.74,.74,h,col,'#8e9ca8','#f3e6d3');if(type==='tower'){block(x+.2,y+.2,.6,.6,h+4,'#a5bec7','#7797a8','#d4e7e7')}for(let floor=9;floor<h-4;floor+=13){for(let j=0;j<2;j++){let p=project(x+.25+j*.29,y+.87,floor);circle(p,2.8,night>.35?'#ffdc85':'#d9eced');let q=project(x+.87,y+.26+j*.27,floor);circle(q,2.5,night>.35?'#f8d99a':'#cadfe3')}}if(type==='house'){let door=project(x+.48,y+.88,8);circle(door,4,'#846c67')}}function car(x,y,axis,t,night){let v=(t*.000045+rnd(x,y))%1,p=axis==='x'?project(x+v,y+.52,2):project(x+.52,y+v,2);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(axis==='x'?.45:-.45);ctx.fillStyle=rnd(x+2,y)>.5?'#f7aa77':'#6b9fc4';ctx.fillRect(-8*zoom,-4*zoom,16*zoom,8*zoom);ctx.fillStyle='#f4f4ed';ctx.fillRect(-2*zoom,-3*zoom,6*zoom,6*zoom);ctx.restore();if(night>.3)circle({x:p.x+7*zoom,y:p.y+2*zoom},2,'#fff0ad')}
function render(t){if(!lastFrame)lastFrame=t;let dt=Math.min(t-lastFrame,100);lastFrame=t;if(!paused){clock+=dt*speed;carClock+=dt*speed}let phase=(clock/1000/65)%1,day=(Math.cos(phase*Math.PI*2)+1)/2,night=1-day;let bg=day>.4?'#d1e6e9':'#8496b5';ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();let center=project(N/2,N/2);ctx.translate(0,0);let count=0;for(let sum=0;sum<=2*(N-1);sum++){for(let x=0;x<N;x++){let y=sum-x;if(y<0||y>=N)continue;let type=world[y*N+x];tile(x,y,type==='road'?'#c7cbd0':type==='park'?'#8ebf9a':'#9ac7a5');if(type==='road'){if(x%4===0&&y%4!==0)line(project(x+.5,y+.16),project(x+.5,y+.84),'#fff6d2',1.6);if(y%4===0&&x%4!==0)line(project(x+.16,y+.5),project(x+.84,y+.5),'#fff6d2',1.6);if((x+y)%3===0)car(x,y,x%4===0?'y':'x',carClock,night)}else if(type==='tree')tree(x,y,clock);else if(type==='park'){if(rnd(x,y)>.5)tree(x,y,t);else{circle(project(x+.5,y+.5,1),12,'#e8d6aa');circle(project(x+.5,y+.5,2),7,'#86c9cf')}}else if(type==='house'||type==='tower'){building(x,y,type,clock,night);count++}if(hover&&hover.x===x&&hover.y===y){polygon([project(x,y),project(x+1,y),project(x+1,y+1),project(x,y+1)],'#ffffff55')}}}ctx.restore();if(weather==='rain'){ctx.strokeStyle='#dcecff99';ctx.lineWidth=1.3;for(let i=0;i<130;i++){let xx=(rnd(i,7)*W+clock*.15+i*13)%W,yy=(rnd(i,11)*H+clock*.5+i*41)%H;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx-7,yy+16);ctx.stroke()}}else if(weather==='snow'){for(let i=0;i<95;i++){let xx=(rnd(i,9)*W+Math.sin(clock*.0004+i)*24+W)%W,yy=(rnd(i,13)*H+clock*.025*(.5+rnd(i,2)))%H;circle({x:xx,y:yy},1.8,'#fffef0dd')}}if(night>.1){ctx.fillStyle='rgba(24,39,76,'+(night*.22)+')';ctx.fillRect(0,0,W,H)}document.querySelector('#stats').textContent=(weather==='rain'?'☂ ':weather==='snow'?'❄ ':'☀ ')+(day>.6?'白昼':day>.25?'黄昏':'夜晚')+'  ·  '+count+' 栋建筑';requestAnimationFrame(render)}requestAnimationFrame(render);
function locate(px,py){let a=(px-W/2-panX)/(S*zoom),b=(py-H/2-panY)/(S*.48*zoom);let x=Math.floor((a+b)/2),y=Math.floor((b-a)/2);return x>=0&&y>=0&&x<N&&y<N?{x,y}:null}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false}});c.addEventListener('pointermove',e=>{if(drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;panX=drag.px+dx;panY=drag.py+dy}else hover=locate(e.clientX,e.clientY)});c.addEventListener('pointerup',e=>{if(drag&&!drag.moved){let p=locate(e.clientX,e.clientY);if(p&&tool!=='view'){world[p.y*N+p.x]=tool==='erase'?'empty':tool;save();notify('城市已更新 · 自动保存')}}drag=null});c.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.45,2.3)},{passive:false});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 继续':'⏸ 暂停'};document.querySelector('#weather').onclick=e=>{weather=weather==='sun'?'rain':weather==='rain'?'snow':'sun';e.currentTarget.textContent=weather==='sun'?'☀ 晴天':weather==='rain'?'☂ 下雨':'❄ 下雪'};document.querySelector('#speed').onclick=e=>{speed=speed===1?2:speed===2?4:1;e.currentTarget.textContent=speed+'× 速度'};document.querySelector('#capture').onclick=()=>{const a=document.createElement('a');a.download='little-city.png';a.href=c.toDataURL('image/png');a.click();notify('城市截图已保存')};document.querySelector('#share').onclick=async()=>{let url=location.href.split('#')[0]+'#city='+btoa(JSON.stringify(world));try{await navigator.clipboard.writeText(url);notify('城市分享链接已复制')}catch{prompt('复制城市分享链接',url)}};document.querySelector('#reset').onclick=()=>{if(confirm('确定要重置这座城市吗？')){world=initial();save();history.replaceState(null,'',location.pathname+location.search);notify('城市已重置')}};save();
</script></body></html>
