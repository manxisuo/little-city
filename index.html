<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little City · 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;color:#2d4354;background:#d3e7ed}#scene{position:fixed;inset:0}button{font:inherit;cursor:pointer;border:0;background:#f0f3ee;color:#2d4354;border-radius:13px;padding:11px 13px;font-weight:650}button.active{background:#315f72;color:white}button:focus-visible{outline:3px solid #f1b66b}header,.stats,.dock,.float,.drawer,#toast{position:fixed;z-index:2}header{left:16px;top:16px;background:#fffdf2e8;backdrop-filter:blur(16px);padding:14px 18px;border-radius:21px;box-shadow:0 12px 35px #2b455a18}h1{font-size:21px;letter-spacing:-.7px;margin:0}.sub{font-size:12px;color:#74889a;margin:4px 0 0}.stats{right:16px;top:16px;padding:12px 15px;background:#fffdf2e8;border-radius:17px;font-size:12px}.dock{bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:9px;background:#fffdf2ed;backdrop-filter:blur(16px);border-radius:21px;max-width:calc(100vw - 20px);overflow-x:auto;box-shadow:0 12px 35px #2b455a24;scrollbar-width:none}.dock button{white-space:nowrap;flex:none;font-size:13px}.float{right:16px;top:85px;display:grid;gap:8px}.float button{width:44px;height:44px;background:#fffdf2eb;font-size:20px}.drawer{display:none;right:16px;top:85px;width:min(300px,calc(100vw - 32px));padding:18px;border-radius:20px;background:#fffdf4f5;box-shadow:0 15px 45px #24384a33}.drawer.open{display:block}.drawer h2{font-size:17px;margin:0 0 12px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{font-size:12px}.help{font-size:12px;color:#788b9a;line-height:1.6}#toast{left:50%;top:90px;transform:translateX(-50%);background:#fffdf3ee;padding:10px 14px;border-radius:14px;display:none;max-width:85vw;text-align:center}#toast:not(:empty){display:block}#error{position:fixed;inset:0;display:none;z-index:10;background:#fffaf3;padding:35px;color:#6e3540}#error.show{display:block}@media(max-width:600px){header{left:10px;top:10px;padding:10px 12px}h1{font-size:17px}.sub{font-size:10px}.stats{right:10px;top:10px;padding:10px;font-size:11px}.float{right:10px;top:78px}.dock{bottom:12px}.drawer{right:10px;top:78px}}
</style></head><body>
<div id="scene"></div><header><h1>Little City ✦ <small style="font-size:10px">3D</small></h1><p class="sub">一座会呼吸的微型城市</p></header>
<aside class="stats" id="stats">城市加载中…</aside>
<nav class="dock" aria-label="城市建造"><button class="active" data-tool="view">✥ 探索</button><button data-tool="house">⌂ 住宅</button><button data-tool="tower">▥ 高楼</button><button data-tool="tree">♣ 树木</button><button data-tool="park">✿ 公园</button><button data-tool="shop">☕ 商店</button><button data-tool="clock">◷ 钟楼</button><button data-tool="road">═ 道路</button><button data-tool="erase">⌫ 拆除</button></nav>
<div class="float"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="settings" aria-label="设置">☷</button></div>
<section class="drawer" id="drawer"><button id="close" style="float:right">✕</button><h2>城市控制台</h2><div class="actions"><button id="pause">⏸ 暂停</button><button id="weather">☀ 晴天</button><button id="speed">1× 速度</button><button id="capture">📷 截图</button><button id="share">↗ 分享</button><button id="preset">✦ 示范城</button><button id="reset">↺ 重置</button><button id="recenter">◎ 回到中心</button></div><p class="help">单指拖动旋转 · 双指缩放/平移 · 点击地块建造。桌面端可用鼠标旋转、滚轮缩放、右键平移。</p></section>
<div id="toast" role="status"></div><div id="error"><h2>3D 引擎未能启动</h2><p id="errorMessage"></p><p>请检查网络连接及浏览器 WebGL 支持。原有城市存档未被删除。</p></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';
const N=17,KEY='little-city-v1',KINDS=['road','house','tower','tree','park','empty','shop','clock'];
const rnd=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const initial=()=>Array.from({length:N*N},(_,i)=>{const x=i%N,y=Math.floor(i/N),r=rnd(x,y);if(x%4===0||y%4===0)return 'road';const d=Math.hypot(x-8,y-8);if(d<3.4)return r<.6?'park':r<.8?'tree':'house';if(x>9&&y<8)return r<.62?'tower':r<.78?'shop':'tree';if(x<8&&y>8)return r<.6?'house':r<.8?'tree':'park';return r<.14?'tree':r<.26?'park':r<.7?'house':r<.94?'tower':'shop'});
let world;try{world=JSON.parse(localStorage.getItem(KEY))}catch{}if(!Array.isArray(world)||world.length!==N*N||!world.every(v=>KINDS.includes(v)))world=initial();
try{const encoded=new URLSearchParams(location.hash.slice(1)).get('city');if(encoded){const data=JSON.parse(atob(encoded));if(Array.isArray(data)&&data.length===N*N&&data.every(v=>KINDS.includes(v)))world=data}}catch{}
const scene=new THREE.Scene();scene.background=new THREE.Color('#d4e7ed');scene.fog=new THREE.Fog('#d4e7ed',27,65);
const camera=new THREE.OrthographicCamera(-13,13,13,-13,.1,120);camera.position.set(21,25,23);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'default'});const mobile=matchMedia('(pointer:coarse)').matches;renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.1:1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.querySelector('#scene').append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.minPolarAngle=.25;controls.maxPolarAngle=1.35;controls.minZoom=.65;controls.maxZoom=3.4;controls.target.set(0,0,0);controls.enablePan=true;controls.update();
const hemi=new THREE.HemisphereLight('#e8f7ff','#90a68d',2.1);scene.add(hemi);const sun=new THREE.DirectionalLight('#fff2d6',3.1);sun.position.set(-12,24,9);sun.castShadow=true;sun.shadow.mapSize.set(mobile?512:1024,mobile?512:1024);sun.shadow.camera.left=-17;sun.shadow.camera.right=17;sun.shadow.camera.top=17;sun.shadow.camera.bottom=-17;sun.shadow.normalBias=.02;scene.add(sun);
const root=new THREE.Group();scene.add(root);const moving=new THREE.Group();scene.add(moving);
const materialCache=new Map(),geometryCache=new Map();function geometry(key,create){if(!geometryCache.has(key))geometryCache.set(key,create());return geometryCache.get(key)}function mat(color,emissive=false){const key=color+'|'+emissive;if(!materialCache.has(key))materialCache.set(key,new THREE.MeshStandardMaterial({color,roughness:.83,metalness:0,emissive:emissive?color:'#000000',emissiveIntensity:emissive?.25:0}));return materialCache.get(key)}
function cube(parent,x,y,z,w,h,d,color){const mesh=new THREE.Mesh(geometry('unitBox',()=>new THREE.BoxGeometry(1,1,1)),mat(color));mesh.scale.set(w,h,d);mesh.position.set(x,y+h/2,z);mesh.castShadow=h>.16;mesh.receiveShadow=true;parent.add(mesh);return mesh}
function ball(parent,x,y,z,r,color){const mesh=new THREE.Mesh(geometry('unitBall',()=>new THREE.IcosahedronGeometry(1,1)),mat(color));mesh.scale.setScalar(r);mesh.position.set(x,y,z);mesh.castShadow=true;parent.add(mesh);return mesh}
function cone(parent,x,y,z,r,h,color,n=4){const mesh=new THREE.Mesh(geometry('unitCone:'+n,()=>new THREE.ConeGeometry(1,1,n)),mat(color));mesh.scale.set(r,h,r);mesh.position.set(x,y+h/2,z);mesh.rotation.y=Math.PI/4;mesh.castShadow=true;parent.add(mesh);return mesh}
const colors=['#e9a89f','#e8c48f','#9ebfc2','#b4a6d2','#9db8d7','#d8b6a5'];
// V7 reusable miniature details
function planter(g,x,z){cube(g,x,0,z,.19,.18,.19,'#d7a58c');ball(g,x,.27,z,.18,'#659e7c')}
function bench(g,x,z){cube(g,x,.16,z,.43,.07,.17,'#bb8d71');cube(g,x,.21,z-.08,.43,.25,.05,'#bb8d71')}
function lamp(g,x,z){cube(g,x,0,z,.045,.67,.045,'#687f83');ball(g,x,.77,z,.1,'#ffe7b0')}
function plant(g,x,z,scale=1){cube(g,x,0,z,.09*scale,.55*scale,.09*scale,'#8a7460');ball(g,x,.72*scale,z,.37*scale,'#529b7a');ball(g,x-.17*scale,.83*scale,z,.25*scale,'#78b997');ball(g,x+.16*scale,.74*scale,z+.08*scale,.25*scale,'#92c69a')}
function flower(g,x,z,i){ball(g,x,.13,z,.09,['#f7d18c','#f5b9bf','#f7eee0'][i%3])}
function house(g,x,z,r,shop=false){const h=1.2+r*.8,c=colors[Math.floor(r*colors.length)];cube(g,x,0,z,.77,h,.76,c);const roof=cone(g,x,h,z,.65,.65,shop?'#6b9b9d':'#b97771');roof.rotation.y=Math.PI/4;for(let k=-1;k<=1;k+=2){cube(g,x+k*.2,h*.55,z+.39,.15,.22,.025,'#d9eaf0');cube(g,x+.39,h*.55,z+k*.2,.025,.22,.15,'#d9eaf0')}cube(g,x,0,z+.396,.17,.42,.025,'#856d67');cube(g,x,h-.12,z+.405,.65,.07,.045,'#f4eee0');if(shop){cube(g,x,.58,z+.48,.67,.12,.25,'#f3d4a7');cube(g,x,.58,z+.625,.52,.08,.02,'#c9786c');cube(g,x,.84,z+.414,.43,.18,.025,'#f6ead9');planter(g,x-.38,z+.37)}else{if(r>.5)plant(g,x-.43,z+.37,.45);if(r>.28)planter(g,x+.34,z+.36);cube(g,x+.24,h+.06,z-.08,.13,.23,.13,'#e7ded1')}}
function tower(g,x,z,r){const h=2.5+r*2.1,c=colors[Math.floor(r*colors.length)];cube(g,x,0,z,.78,h,.76,c);cube(g,x,h,z,.82,.15,.8,'#e2e9e4');for(let level=.4;level<h-.1;level+=.46)for(let k=-1;k<=1;k+=2){cube(g,x+k*.2,level,z+.391,.14,.21,.014,'#b9e2eb');cube(g,x+.391,level,z+k*.2,.014,.21,.14,'#b9e2eb')}if(r>.6)cube(g,x,h+.15,z,.035,.65,.035,'#778e9c');else{cube(g,x-.2,h+.15,z-.18,.2,.22,.24,'#a7bac0');cube(g,x+.18,h+.15,z+.12,.24,.12,.2,'#8caab1')}}
function clockTower(g,x,z){cube(g,x,0,z,.8,3.25,.8,'#e8c69b');cone(g,x,3.25,z,.7,.85,'#8caaa5');for(const face of [-1,1]){const p=ball(g,x,2.72,z+face*.42,.23,'#fff5d8');p.scale.z=.12}cube(g,x,0,z+.43,.2,.45,.03,'#98766b');ball(g,x,4.18,z,.12,'#e6b77b')}
function park(g,x,z,r){cube(g,x,0,z,.96,.035,.96,'#8ec19c');if(r>.48){plant(g,x-.22,z-.15,.75);plant(g,x+.25,z+.18,.52)}else{const water=new THREE.Mesh(geometry('fountain',()=>new THREE.CylinderGeometry(.27,.27,.04,20)),mat('#7bc2c8'));water.position.set(x,.07,z);g.add(water);bench(g,x-.28,z+.28);lamp(g,x+.33,z-.3)}for(let i=0;i<4;i++)flower(g,x+(rnd(i+x,z)-.5)*.72,z+(rnd(i+7,z)-.5)*.7,i)}
function road(g,x,z){cube(g,x,0,z,1,.055,1,'#b7c0c4');const east=(x<N-1&&world[z*N+x+1]==='road')||(x>0&&world[z*N+x-1]==='road');const north=(z>0&&world[(z-1)*N+x]==='road')||(z<N-1&&world[(z+1)*N+x]==='road');if(east&&!north)cube(g,x,.055,z,.4,.009,.025,'#f9e9ba');if(north&&!east)cube(g,x,.055,z,.025,.009,.4,'#f9e9ba');if((x+z)%6===0)lamp(g,x-.38,z-.38);if((x+z)%9===0){cube(g,x+.35,.055,z+.35,.19,.18,.16,'#8aa2a4');cube(g,x+.35,.24,z+.35,.22,.045,.19,'#e2e8db')}}
const cellGroups=[];function rebuild(){for(const child of [...root.children])root.remove(child);cellGroups.length=0;const base=cube(root,0,-.38,0,N+.8,.35,N+.8,'#8eae9c');base.receiveShadow=true;for(let z=0;z<N;z++)for(let x=0;x<N;x++){const type=world[z*N+x],px=x-(N-1)/2,pz=z-(N-1)/2,r=rnd(x,z);const g=new THREE.Group();root.add(g);g.userData.type=type;cellGroups.push(g);cube(g,px,-.19,pz,1,.09,1,type==='road'?'#b7c0c4':(x+z)%3===0?'#a6caa6':'#98c4a2');if(type==='road')road(g,px,pz);else if(type==='tree'){plant(g,px,pz,1+r*.35);if(r>.5)planter(g,px+.34,pz+.33)}else if(type==='park')park(g,px,pz,r);else if(type==='house')house(g,px,pz,r);else if(type==='tower')tower(g,px,pz,r);else if(type==='shop')house(g,px,pz,r,true);else if(type==='clock')clockTower(g,px,pz)}buildTraffic()}
let cars=[];const dirs=[[1,0],[0,1],[-1,0],[0,-1]];const isRoad=(x,z)=>x>=0&&z>=0&&x<N&&z<N&&world[z*N+x]==='road';function options(x,z){return dirs.map(([dx,dz],dir)=>({x:x+dx,z:z+dz,dir})).filter(p=>isRoad(p.x,p.z))}
function buildTraffic(){for(const c of [...moving.children])moving.remove(c);cars=[];const cells=[];for(let z=0;z<N;z++)for(let x=0;x<N;x++)if(isRoad(x,z)&&options(x,z).length)cells.push({x,z});for(let i=0;i<Math.min(24,Math.floor(cells.length/5));i++){const p=cells[Math.floor(rnd(i+5,i+12)*cells.length)];const g=new THREE.Group();cube(g,0,.11,0,.32,.17,.2,['#e8a27e','#79a9c4','#f2d28e'][i%3]);cube(g,.015,.28,0,.16,.1,.16,'#d8edf1');moving.add(g);cars.push({...p,dir:0,t:rnd(i,9),mesh:g,seed:i})}}
function updateCars(dt,clock){for(const v of cars){v.t+=dt*.00032;while(v.t>=1){v.t-=1;let next=options(v.x,v.z);if(!next.length)break;const f=next.filter(n=>n.dir!==(v.dir+2)%4);if(f.length)next=f;const n=next[Math.floor(rnd(v.seed+v.x*13+Math.floor(clock/13000),v.z*17)*next.length)];v.x=n.x;v.z=n.z;v.dir=n.dir}const [dx,dz]=dirs[v.dir];v.mesh.position.set(v.x-(N-1)/2-dx*(1-v.t),.08,v.z-(N-1)/2-dz*(1-v.t));v.mesh.rotation.y=v.dir*Math.PI/2}}
function save(x,z){try{localStorage.setItem(KEY,JSON.stringify(world))}catch{}if(Number.isInteger(x)&&Number.isInteger(z)){updateCell(x,z);buildTraffic()}else rebuild()}
function updateCell(x,z){const idx=z*N+x,old=cellGroups[idx];if(old){root.remove(old)}const type=world[idx],px=x-(N-1)/2,pz=z-(N-1)/2,r=rnd(x,z),g=new THREE.Group();root.add(g);cellGroups[idx]=g;cube(g,px,-.19,pz,1,.09,1,type==='road'?'#b7c0c4':(x+z)%3===0?'#a6caa6':'#98c4a2');if(type==='road')road(g,px,pz);else if(type==='tree'){plant(g,px,pz,1+r*.35);if(r>.5)planter(g,px+.34,pz+.33)}else if(type==='park')park(g,px,pz,r);else if(type==='house')house(g,px,pz,r);else if(type==='tower')tower(g,px,pz,r);else if(type==='shop')house(g,px,pz,r,true);else if(type==='clock')clockTower(g,px,pz);if(type==='road'||old?.userData?.type==='road'){for(const [dx,dz] of dirs){const nx=x+dx,nz=z+dz;if(nx>=0&&nx<N&&nz>=0&&nz<N&&world[nz*N+nx]==='road'){const neighbor=cellGroups[nz*N+nx];if(neighbor){root.remove(neighbor);const ng=new THREE.Group();root.add(ng);cellGroups[nz*N+nx]=ng;const xx=nx-(N-1)/2,zz=nz-(N-1)/2;cube(ng,xx,-.19,zz,1,.09,1,'#b7c0c4');road(ng,xx,zz)}}}}g.userData.type=type}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0);let down=null,tool='view',paused=false,speed=1,weather='sun',elapsed=0,last=0;
const toast=(msg)=>{const el=document.querySelector('#toast');el.textContent=msg;setTimeout(()=>{if(el.textContent===msg)el.textContent=''},3000)};
renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();document.querySelector('#errorMessage').textContent='图形上下文丢失，可能是设备显存不足。请刷新页面恢复。';document.querySelector('#error').classList.add('show')});renderer.domElement.addEventListener('webglcontextrestored',()=>location.reload());renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>7||tool==='view'){down=null;return}down=null;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const p=new THREE.Vector3();if(!ray.ray.intersectPlane(ground,p))return;const x=Math.round(p.x+(N-1)/2),z=Math.round(p.z+(N-1)/2);if(x<0||x>=N||z<0||z>=N)return;world[z*N+x]=tool==='erase'?'empty':tool;save(x,z);toast('城市已更新并保存')});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(el=>el.classList.toggle('active',el===b))});
const drawer=document.querySelector('#drawer');document.querySelector('#settings').onclick=()=>drawer.classList.toggle('open');document.querySelector('#close').onclick=()=>drawer.classList.remove('open');document.querySelector('#zoomIn').onclick=()=>{camera.zoom=Math.min(3.4,camera.zoom*1.2);camera.updateProjectionMatrix()};document.querySelector('#zoomOut').onclick=()=>{camera.zoom=Math.max(.65,camera.zoom/1.2);camera.updateProjectionMatrix()};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ 继续':'⏸ 暂停'};document.querySelector('#speed').onclick=e=>{speed=speed===1?2:speed===2?4:1;e.currentTarget.textContent=speed+'× 速度'};document.querySelector('#weather').onclick=e=>{weather=weather==='sun'?'rain':weather==='rain'?'snow':'sun';e.currentTarget.textContent=weather==='sun'?'☀ 晴天':weather==='rain'?'☂ 下雨':'❄ 下雪'};
document.querySelector('#recenter').onclick=()=>{controls.target.set(0,0,0);camera.position.set(21,25,23);camera.zoom=1;camera.updateProjectionMatrix();controls.update()};
document.querySelector('#capture').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='little-city-3d.png';a.click()};
document.querySelector('#share').onclick=async()=>{const url=location.href.split('#')[0]+'#city='+btoa(JSON.stringify(world));try{await navigator.clipboard.writeText(url);toast('分享链接已复制')}catch{prompt('复制分享链接',url)}};
document.querySelector('#preset').onclick=()=>{if(confirm('生成新的 3D 示范城？将覆盖本地布局，建议先备份分享链接。')){world=initial();save();toast('示范城已生成')}};
document.querySelector('#reset').onclick=()=>{if(confirm('重置城市？')){world=initial();save();history.replaceState(null,'',location.pathname+location.search)}};
function resize(){const w=innerWidth,h=innerHeight,aspect=w/h,span=12;camera.left=-span*aspect;camera.right=span*aspect;camera.top=span;camera.bottom=-span;camera.updateProjectionMatrix();renderer.setSize(w,h)}addEventListener('resize',resize);resize();rebuild();
const stats=document.querySelector('#stats');let lastStats=0;function frame(t){requestAnimationFrame(frame);if(!last)last=t;const dt=Math.min(80,t-last);last=t;if(!paused){elapsed+=dt*speed;updateCars(dt*speed,elapsed)}const day=(1+Math.cos(elapsed/65000*Math.PI*2))/2;sun.intensity=1+2.1*day;hemi.intensity=1.1+day;scene.background.set(day>.3?'#d4e7ed':'#8d9eb6');scene.fog.color.copy(scene.background);controls.update();renderer.render(scene,camera);if(t-lastStats>450){lastStats=t;stats.textContent=(weather==='rain'?'☂ ':weather==='snow'?'❄ ':'☀ ')+(day>.6?'白昼':day>.25?'黄昏':'夜晚')+' · '+world.filter(v=>['house','tower','shop','clock'].includes(v)).length+' 栋建筑'}}
requestAnimationFrame(frame);
</script></body></html>
