function planter(g,x,z){cube(g,x,0,z,.19,.18,.19,'#d7a58c');ball(g,x,.27,z,.18,'#659e7c')}
function bench(g,x,z){cube(g,x,.16,z,.43,.07,.17,'#bb8d71');cube(g,x,.21,z-.08,.43,.25,.05,'#bb8d71')}
function lamp(g,x,z){cube(g,x,0,z,.045,.67,.045,'#687f83');ball(g,x,.77,z,.1,'#ffe7b0')}

// One shared animated water shader and plane geometry for every river tile.
// Uses world-space coordinates so highlights flow continuously across tile seams.
// V7.3: bright shallow-blue river, visibly moving highlights across tile boundaries.
const waterUniforms={uTime:{value:0},uDay:{value:1}};
const waterMaterial=new THREE.ShaderMaterial({

 fragmentShader:`precision highp float;uniform float uTime;uniform float uDay;varying vec2 vWorld;

// River geometry: shared 16 shoreline variants, smooth insets only at exposed banks.

function trainPath(){

  if(!isRail(x,z)||visited.has(z*N+x))continue;

  while(stack.length){const p=stack.pop();component.push(p);for(const q of railNeighbors(p.x,p.z)){const id=q.z*N+q.x;if(!visited.has(id)){visited.add(id);stack.push(q)}}}

 if(!components.length)return [];

function buildTrains(){
